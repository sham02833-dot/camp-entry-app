<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4e78">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>إدخال بيانات الأسر</title>
<style>
:root{--navy:#1f4e78;--blue:#2e75b6;--gold:#ffc000;--bg:#f3f6fa;--card:#fff;--line:#d5dde8;--txt:#1d2733;--mut:#6b7886;--err:#c00000;--errbg:#fde9e7;--warn:#9a6b00;--warnbg:#fff2cc;--ok:#2f7d32;--okbg:#e2f0d9}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",Arial,sans-serif;font-size:16px;line-height:1.5}
header{background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}
header .sub{font-size:12px;opacity:.85}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:15px}
main{padding:12px 12px 90px;max-width:900px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:620px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{border-radius:12px;padding:10px;text-align:center;color:#fff}
.stat b{display:block;font-size:28px;line-height:1.1}
.stat span{font-size:13px;opacity:.95}
button,.btn{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:8px 16px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:600;text-decoration:none}
.btn.sec{background:#e8eef6;color:var(--navy)}
.btn.gold{background:var(--gold);color:#222}
.btn.red{background:var(--err)}
.btn.small{min-height:36px;padding:4px 10px;font-size:14px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
input,select,textarea{font:inherit;width:100%;min-height:46px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--txt)}
input:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(46,117,182,.2)}
input.bad,select.bad{border-color:var(--err);background:var(--errbg)}
input.warnf,select.warnf{border-color:#e0a800;background:var(--warnbg)}
label{display:block;font-size:13px;color:var(--mut);margin:0 2px 3px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}.grid .full{grid-column:1/-1}}
.num{direction:ltr;text-align:right}
.fam{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff;margin:8px 0;cursor:pointer}
.fam .t{flex:1;min-width:0}
.fam .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fam .t span{font-size:13px;color:var(--mut)}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.b-ok{background:var(--okbg);color:var(--ok)}.b-w{background:var(--warnbg);color:var(--warn)}.b-e{background:var(--errbg);color:var(--err)}
.msgs{margin:8px 0;padding:0;list-style:none}
.msgs.sticky{position:sticky;bottom:72px;background:var(--bg);padding:6px 0;max-height:34vh;overflow:auto;z-index:5}
.msgs li{padding:6px 10px;border-radius:8px;margin:4px 0;font-size:14px}
.msgs .e{background:var(--errbg);color:var(--err);border-right:4px solid var(--err)}
.msgs .w{background:var(--warnbg);color:var(--warn);border-right:4px solid #e0a800}
.msgs .g{background:var(--okbg);color:var(--ok);border-right:4px solid var(--ok)}
.bar{position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;z-index:10}
.bar .btn{flex:1;max-width:260px}
.toast{position:fixed;bottom:84px;right:50%;transform:translateX(50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:50;max-width:90%;font-size:15px}
.banner{background:var(--warnbg);border:1px solid #e0c060;color:#6b4f00;border-radius:10px;padding:8px 12px;margin:10px 0;font-size:14px}
h2{font-size:17px;color:var(--navy);margin:14px 2px 4px}
.mem{display:flex;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.mem:last-child{border:0}
.mem .t{flex:1;min-width:0}.mem small{color:var(--mut)}
.hint{font-size:13px;color:var(--mut)}
table.t{border-collapse:collapse;width:100%;font-size:14px}table.t td,table.t th{border:1px solid var(--line);padding:4px 8px;text-align:right}table.t th{background:#e8eef6}
</style>
</head>

function parseDob(s) {            // strict dd/mm/yyyy, real calendar date

  if (!m) return null;
  const d = +m[1], mo = +m[2], y = +m[3];
  if (y < 1900) return null;
  const dt = new Date(y, mo - 1, d);
  return (dt.getFullYear() === y && dt.getMonth() === mo - 1 && dt.getDate() === d) ? dt : null;
}
function ageOf(dt) {

}

     <div class="row" style="margin-top:6px">${u.phone ? `<a class="btn sec small" href="tel:${esc(u.phone)}">📞 ${esc(u.phone)}</a>` : ""}${wa ? `<a class="btn sec small" target="_blank" href="https://wa.me/${intl(wa)}">💬 واتساب</a>` : ""}${u.email ? `<a class="btn sec small" href="mailto:${esc(u.email)}">✉ بريد</a>` : ""}</div></div>
     <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">${u.active === false ? '<span class="badge b-e">موقوف</span>' : '<span class="badge b-ok">فعّال</span>'}${canManageUser(u) || (isAdmin()) ? `<button class="btn small sec" onclick="go('userform',{id:'${u.id}'})">تعديل</button>` : ""}</div></div>`;

}
function viewUserForm() {
  const a = VIEW.arg || {}; let u = VIEW.du;
  if (!u) { const ex = a.id ? DB.users.find(x => x.id === a.id) : null; u = VIEW.du = ex ? JSON.parse(JSON.stringify(ex)) : { id: null, name: "", username: "", roleId: "researcher", camps: myCamps().length === 1 ? [myCamps()[0].id] : [], locs: [], phone: "", wa: "", email: "", active: true, from: "", to: "" }; u.newPw = ""; }

  const roles = assignableRoles(), campList = myCamps(), locSet = [...new Set(campList.filter(c => u.camps.includes(c.id)).flatMap(c => c.locs))].filter(c => isAdmin() || !(me().locs || []).length || me().locs.includes(c));

   ${fieldHtml("u_name", "الاسم الكامل", 'data-k="name"', u.name)}${fieldHtml("u_user", "اسم المستخدم (لاتيني)", `data-k="username" dir="ltr" autocapitalize="none" ${a.id ? "readonly" : ""}`, u.username, "text", "num")}

   ${fieldHtml("u_phone", "الجوال", 'data-k="phone" inputmode="tel"', u.phone, "text", "num")}${fieldHtml("u_wa", "واتساب (فارغ = نفس الجوال)", 'data-k="wa" inputmode="tel"', u.wa, "text", "num")}
   <div class="full">${fieldHtml("u_mail", "البريد الإلكتروني", 'data-k="email" dir="ltr"', u.email, "email", "num")}</div>
   <div class="full"><label>المخيمات المسموحة</label><div>${campList.map(c => `<label style="display:flex;gap:8px;align-items:center;margin:4px 0;color:var(--txt);font-size:15px"><input type="checkbox" style="width:22px;min-height:22px" data-camp="${c.id}"${u.camps.includes(c.id) ? " checked" : ""}> ${esc(c.name)}</label>`).join("") || '<span class="hint">أنشئ مخيماً أولاً</span>'}</div></div>
   <div class="full"><label>التجمعات المسموحة (اتركها كلها بلا تحديد = كل تجمعات المخيم)</label><div style="max-height:170px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px">${locSet.map(c => `<label style="display:flex;gap:8px;align-items:center;margin:3px 0;color:var(--txt);font-size:15px"><input type="checkbox" style="width:22px;min-height:22px" data-loc="${c}"${u.locs.includes(c) ? " checked" : ""}> ${esc((L.loc[c] || {}).ar || c)} (${c})</label>`).join("") || '<span class="hint">اختر مخيماً</span>'}</div></div>
   ${fieldHtml("u_from", "صالح من (dd/mm/yyyy — اختياري)", 'data-k="from" inputmode="numeric" placeholder="01/11/2026"', u.from, "text", "num")}${fieldHtml("u_to", "صالح حتى (اختياري)", 'data-k="to" inputmode="numeric" placeholder="31/12/2026"', u.to, "text", "num")}
   <div class="full"><label style="display:flex;gap:8px;align-items:center;color:var(--txt);font-size:16px"><input type="checkbox" style="width:24px;min-height:24px" data-active${u.active !== false ? " checked" : ""}> الحساب فعّال</label></div></div></div><ul class="msgs sticky" id="u_msg"></ul>`;

function onUserInput(e) {
  const t = e.target, u = VIEW.du;
  if (t.dataset.k) { u[t.dataset.k] = t.value; if (t.dataset.k === "roleId") { /* nothing */ } }
  else if (t.dataset.camp !== undefined) { u.camps = t.checked ? [...new Set([...u.camps, t.dataset.camp])] : u.camps.filter(x => x !== t.dataset.camp); u.locs = []; const keep = VIEW.du; render(); VIEW.du = keep; }
  else if (t.dataset.loc !== undefined) { u.locs = t.checked ? [...new Set([...u.locs, t.dataset.loc])] : u.locs.filter(x => x !== t.dataset.loc); }
  else if (t.dataset.active !== undefined) u.active = t.checked;
}
async function saveUser() {
  const u = VIEW.du, err = [], isNew = !u.id, un = (u.username || "").trim().toLowerCase();
  if (!(u.name || "").trim()) err.push("الاسم مطلوب"); if (!/^[A-Za-z0-9._-]{3,}$/.test(un)) err.push("اسم المستخدم: 3 أحرف أو أرقام لاتينية فأكثر");
  if (DB.users.some(x => x.username === un && x.id !== u.id)) err.push("اسم المستخدم مستخدم من قبل");
  if (isNew && (u.newPw || "").length < 8) err.push("كلمة المرور أقل من 8 أحرف"); if (!isNew && u.newPw && u.newPw.length < 8) err.push("كلمة المرور الجديدة أقل من 8 أحرف");
  if (u.phone && !phoneOK(u.phone)) err.push("الجوال: 9 أو 10 أرقام"); if (u.wa && !phoneOK(u.wa)) err.push("الواتساب: 9 أو 10 أرقام"); if (u.email && !emailOK(u.email)) err.push("البريد غير صحيح");
  if (u.from && !parseDob(u.from)) err.push("تاريخ البداية غير صالح"); if (u.to && !parseDob(u.to)) err.push("تاريخ النهاية غير صالح");
  if (u.roleId !== "admin" && !u.camps.length) err.push("اختر مخيماً واحداً على الأقل");
  if (!assignableRoles().some(r => r.id === u.roleId)) err.push("ليست لديك صلاحية إسناد هذا الدور");
  if (!isAdmin() && !u.camps.every(c => (me().camps || []).includes(c))) err.push("مخيم خارج نطاقك");
  if (!locsWithin(u.locs)) err.push("حدّد تجمعات ضمن نطاقك فقط (لا يجوز منح أوسع مما تملك)");
  if (u.id && u.id === me().id && u.active === false) err.push("لا يمكنك إيقاف حسابك");
  if (err.length) { $("#u_msg").innerHTML = err.map(e => `<li class="e">❌ ${esc(e)}</li>`).join(""); return; }
  const rec = { ...u, username: un, name: u.name.trim(), ua: Date.now() }; delete rec.newPw;
  if (isNew) { rec.id = uid(); rec.ca = Date.now(); rec.pw = await hashPw(u.newPw); DB.users.push(rec); audit("user_create", un, roleName(rec.roleId)); }
  else { const old = DB.users.find(x => x.id === u.id); rec.pw = u.newPw ? await hashPw(u.newPw) : old.pw; rec.rec = old.rec; Object.assign(old, rec); audit("user_edit", un, (u.newPw ? "كلمة مرور جديدة؛ " : "") + roleName(rec.roleId) + (rec.active === false ? "؛ موقوف" : "")); }
  save(); VIEW.du = null; toast("تم الحفظ ✅"); go("users");
}

function togglePerm(k, on) { const r = VIEW.dr; r.perms = on ? [...new Set([...r.perms, k])] : r.perms.filter(x => x !== k); }
function saveRole() {

function delRole() { const r = VIEW.dr; if (DB.users.some(u => u.roleId === r.id)) return toast("لا يمكن حذف دور له مستخدمون"); if (!confirm("حذف هذا الدور؟")) return; DB.roles = DB.roles.filter(x => x.id !== r.id); audit("role_delete", r.name, ""); save(); VIEW.dr = null; go("roles"); }
