<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">

<title>إدخال بيانات الأسر</title>
<style>
:root{--navy:#1f4e78;--blue:#2e75b6;--gold:#ffc000;--bg:#f3f6fa;--card:#fff;--line:#d5dde8;--txt:#1d2733;--mut:#6b7886;--err:#c00000;--errbg:#fde9e7;--warn:#9a6b00;--warnbg:#fff2cc;--ok:#2f7d32;--okbg:#e2f0d9}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",Arial,sans-serif;font-size:16px;line-height:1.5}
header{background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}
header .sub{font-size:12px;opacity:.85}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:15px}
main{padding:12px 12px 90px;max-width:900px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:620px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{border-radius:12px;padding:10px;text-align:center;color:#fff}
.stat b{display:block;font-size:28px;line-height:1.1}
.stat span{font-size:13px;opacity:.95}
button,.btn{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:8px 16px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:600;text-decoration:none}
.btn.sec{background:#e8eef6;color:var(--navy)}
.btn.gold{background:var(--gold);color:#222}
.btn.red{background:var(--err)}
.btn.small{min-height:36px;padding:4px 10px;font-size:14px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
input,select,textarea{font:inherit;width:100%;min-height:46px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--txt)}
input:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(46,117,182,.2)}
input.bad,select.bad{border-color:var(--err);background:var(--errbg)}
input.warnf,select.warnf{border-color:#e0a800;background:var(--warnbg)}
label{display:block;font-size:13px;color:var(--mut);margin:0 2px 3px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}.grid .full{grid-column:1/-1}}
.num{direction:ltr;text-align:right}
.fam{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff;margin:8px 0;cursor:pointer}
.fam .t{flex:1;min-width:0}
.fam .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fam .t span{font-size:13px;color:var(--mut)}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.b-ok{background:var(--okbg);color:var(--ok)}.b-w{background:var(--warnbg);color:var(--warn)}.b-e{background:var(--errbg);color:var(--err)}
.msgs{margin:8px 0;padding:0;list-style:none}
.msgs.sticky{position:sticky;bottom:72px;background:var(--bg);padding:6px 0;max-height:34vh;overflow:auto;z-index:5}
.msgs li{padding:6px 10px;border-radius:8px;margin:4px 0;font-size:14px}
.msgs .e{background:var(--errbg);color:var(--err);border-right:4px solid var(--err)}
.msgs .w{background:var(--warnbg);color:var(--warn);border-right:4px solid #e0a800}
.msgs .g{background:var(--okbg);color:var(--ok);border-right:4px solid var(--ok)}
.bar{position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;z-index:10}
.bar .btn{flex:1;max-width:260px}
.toast{position:fixed;bottom:84px;right:50%;transform:translateX(50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:50;max-width:90%;font-size:15px}
.banner{background:var(--warnbg);border:1px solid #e0c060;color:#6b4f00;border-radius:10px;padding:8px 12px;margin:10px 0;font-size:14px}
h2{font-size:17px;color:var(--navy);margin:14px 2px 4px}
.mem{display:flex;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.mem:last-child{border:0}
.mem .t{flex:1;min-width:0}.mem small{color:var(--mut)}
.hint{font-size:13px;color:var(--mut)}
.ss{font-size:12px;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.15);white-space:nowrap}.ss.error,.ss.conflict{background:#c00000;font-weight:700}.ss:empty{display:none}
.gbanner{padding:8px 14px;font-size:14px;border-bottom:1px solid #0002}.gbanner.bad{background:#c00000;color:#fff}.gbanner.warn{background:var(--warnbg);color:#6b4f00}.gbanner .btn{margin:2px 4px}
.sw-bg{position:fixed;inset:0;background:rgba(15,30,50,.55);backdrop-filter:blur(2px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;animation:swf .15s}
.sw{background:#fff;border-radius:18px;max-width:380px;width:100%;padding:22px 18px 16px;text-align:center;box-shadow:0 14px 44px rgba(0,0,0,.32);animation:swp .18s}
.sw .ic{width:64px;height:64px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;border:4px solid}
.sw .ic.warning{border-color:#f8bb86;color:#f0a030}.sw .ic.question{border-color:#9bb8c9;color:#5b8aa6}.sw .ic.success{border-color:#a5dc86;color:#43a047}.sw .ic.error{border-color:#f27474;color:#e04848}.sw .ic.info{border-color:#6ccdf0;color:#2a9fd0}
.sw h3{margin:0 0 6px;font-size:19px;color:#2b3440}.sw .tx{font-size:15px;color:#52606d;white-space:pre-line;margin-bottom:12px}
.sw input{margin-bottom:6px;text-align:center}.sw .bt{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}.sw .bt .btn{min-width:112px}.sw .er{color:var(--err);font-size:13px;min-height:18px}
@keyframes swp{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}@keyframes swf{from{opacity:0}to{opacity:1}}
.toast.ok{background:#2e7d32}.toast.err{background:#c62828}.toast.warn{background:#a86400}
.draftbar{background:#e8f1fb;border:1px solid #9ec3e8;border-radius:10px;padding:8px 12px;margin:10px 0;font-size:14px}
table.t{border-collapse:collapse;width:100%;font-size:14px}table.t td,table.t th{border:1px solid var(--line);padding:4px 8px;text-align:right}table.t th{background:#e8eef6}
</style>
</head>

function pickLogo(inp) {
  const f = inp.files[0]; if (!f) return; if (f.size > 4 * 1024 * 1024) return toast("الصورة كبيرة (أكثر من 4 م.ب)");
  const img = new Image(), u = URL.createObjectURL(f); img.onload = () => { const c = document.createElement("canvas"); c.width = c.height = 96; const x = c.getContext("2d"), k = Math.min(96 / img.width, 96 / img.height); x.clearRect(0, 0, 96, 96); x.drawImage(img, (96 - img.width * k) / 2, (96 - img.height * k) / 2, img.width * k, img.height * k); URL.revokeObjectURL(u);
    const d = c.toDataURL("image/png"); if (d.length > 45000) return toast("الشعار معقّد جداً؛ استخدم صورة أبسط"); VIEW.db.logo = d; $("#logoprev").innerHTML = `<img src="${d}" style="width:64px;height:64px;border-radius:10px;border:1px solid var(--line)" alt="">`; };
  img.onerror = () => { URL.revokeObjectURL(u); toast("تعذّرت قراءة الصورة"); }; img.src = u;
}

/* ---------- smart input: wrong keyboard language is fixed as you type; Arabic/Persian digits become 0-9 ---------- */
const normDigits = (s) => String(s ?? "").replace(/[٠-٩۰-۹]/g, d => AR_DIG[d]);
const AR_K = { q: "ض", w: "ص", e: "ث", r: "ق", t: "ف", y: "غ", u: "ع", i: "ه", o: "خ", p: "ح", "[": "ج", "]": "د", a: "ش", s: "س", d: "ي", f: "ب", g: "ل", h: "ا", j: "ت", k: "ن", l: "م", ";": "ك", "'": "ط", z: "ئ", x: "ء", c: "ؤ", v: "ر", b: "لا", n: "ى", m: "ة", ",": "و", ".": "ز", "/": "ظ", H: "أ", N: "آ", Y: "إ", T: "لإ", G: "لأ", B: "لآ" };
const EN_K = { "ا": "h", "أ": "h", "إ": "h", "آ": "n", "ى": "n", "ئ": "z", "ؤ": "c", "ء": "x", "ة": "m" }; for (const [k, v] of Object.entries(AR_K)) if (v.length === 1 && /[a-z\[\];',./]/.test(k) && !EN_K[v]) EN_K[v] = k;
const smartVal = (v, lang) => lang === "ar" ? v.replace(/[A-Za-z\[\];',./]/g, ch => AR_K[ch] || AR_K[ch.toLowerCase()] || ch) : lang === "en" ? v.replace(/[\u0600-\u06FF]/g, ch => EN_K[ch] || (/[\u064B-\u065F\u0640]/.test(ch) ? "" : ch)) : v;
document.addEventListener("input", e => {   // capture phase: runs before the screen's own handlers, which then see the corrected value
  const t = e.target; if (!t || !t.dataset || e.isComposing) return; const lang = t.dataset.lang, num = t.dataset.num; if (!lang && !num) return;
  let v = t.value, w = v; if (num) w = num === "p" ? normDigits(w).replace(/[^\d+]/g, "").replace(/(?!^)\+/g, "") : normDigits(w).replace(/\D/g, "");
  if (lang) { w = smartVal(w, lang); if (t.dataset.case === "lower") w = w.toLowerCase(); }
  if (w !== v) { const pos = t.selectionStart, d = w.length - v.length; t.value = w; try { if (pos != null) t.setSelectionRange(Math.max(0, pos + d), Math.max(0, pos + d)); } catch (e2) { } }
}, true);
document.addEventListener("focusin", e => { const t = e.target; if (t && t.dataset && t.dataset.lang) { t.lang = t.dataset.lang; if (t.dataset.lang === "en") { t.setAttribute("autocapitalize", "none"); t.setAttribute("autocorrect", "off"); t.spellcheck = false; } } });
/* ============================== start ============================== */
["click", "keydown", "touchstart"].forEach(ev => document.addEventListener(ev, () => { lastAct = Date.now(); }, true));
setInterval(() => { if (SESSION && Date.now() - lastAct > 15 * 60000) logout("تم تسجيل الخروج تلقائياً بعد 15 دقيقة خمول"); else if (SESSION && !sessionValid()) render(); }, 30000);
let STORE_PROBLEM = null;
function migrate() {
  const d = DB; d.camps = d.camps || []; d.roles = d.roles || []; d.users = d.users || []; d.audit = d.audit || []; d.imports = d.imports || []; d.deviceId = d.deviceId || uid();
  for (const p of d.people) if (!p.uid) p.uid = uid();
  if ((d.schema || 2) < 3) {   // v0.3: add the new note permissions to the built-in roles of existing installs (custom roles are left to the administrator)
    const add = { admin: ALLP, manager: ["note.add", "note.view.others"], supervisor: ["note.add", "note.view.others"], researcher: ["note.add"], reviewer: ["note.view.others"] };
    for (const r of d.roles) if (add[r.id]) r.perms = [...new Set([...(r.perms || []), ...add[r.id]])];
  }
  d.schema = SCHEMA;
}
function viewStorageProblem() {
  const r = STORE_PROBLEM || {};
  $("#view").innerHTML = `<div class="card"><h2 style="margin-top:0;color:#c00000">⛔ تعذّرت قراءة بيانات هذا الجهاز</h2>
  <div class="hint" style="font-size:15px">لم يستبدل البرنامج بياناتك بقاعدة فارغة ولن يكتب شيئاً فوقها. السبب: <b>${esc(r.why || "غير معروف")}</b></div>
  <ol><li>أغلق أي نافذة أخرى للتطبيق ثم اضغط «إعادة المحاولة».</li><li>لا تمسح بيانات المتصفح قبل تنزيل نسخة من الملف التالف (إن وُجد الزر أدناه).</li><li>استعن بنسخة احتياطية JSON: ابدأ نظاماً جديداً ثم استوردها.</li></ol>
  <div class="row"><button class="btn" onclick="location.reload()">إعادة المحاولة</button>${r.raw ? '<button class="btn sec" onclick="downloadCorrupt()">⬇ تنزيل البيانات التالفة (للإصلاح)</button>' : ""}</div></div>
  ${Store.db ? `<div class="card"><b>بدء نظام جديد</b><div class="hint">تُحفظ البيانات التالفة جانباً في المتصفح قبل أن يبدأ نظام فارغ. لن تتمكن من استعادتها إلا بمساعدة فنية.</div><div class="row" style="margin-top:8px"><button class="btn red small" onclick="startFresh()">بدء نظام جديد</button></div></div>` : ""}`;
}
function downloadCorrupt() { const r = STORE_PROBLEM || {}; if (r.raw) dl(U8(r.raw), "damaged_data_" + stamp() + ".json", "application/json"); }
async function startFresh() {

  try { const cur = await Store.getAux("db").catch(() => null); if (cur) await Store.putAux("corrupt_last", { at: Date.now(), v: cur }); Store.rev = cur && cur.rev || null; Store.legacy = !!(cur && !cur.fmt); }

}
(async function init() {

    if (r.db) { if ((r.db.schema || 2) > SCHEMA) { SAVE.blocked = true; STORE_PROBLEM = { why: "البيانات من إصدار أحدث (" + r.db.schema + ") من هذا التطبيق؛ حدّث التطبيق أولاً" }; } else { const old = (r.db.schema || 2) < SCHEMA; DB = { ...DB, ...r.db, meta: { ...DB.meta, ...(r.db.meta || {}) } }; if (old && Store.db) { try { const raw = await Store.getAux("db"); if (raw) await Store.putAux("snap_premigrate", raw); } catch (e) { } } } }
    if (r.status === "recovered") { SAVE.note = "⚠ تعذّرت قراءة آخر نسخة محفوظة (" + esc(r.why || "") + ") فاستُعيدت لقطة تلقائية من " + (r.at ? new Date(r.at).toLocaleString("ar") : "نسخة أقدم") + ". قد تضيع التعديلات التي تلتها — راجع بياناتك. حُفظت النسخة التالفة جانباً."; if (r.raw && Store.db) { try { await Store.putAux("corrupt_last", { at: Date.now(), s: r.raw }); } catch (e) { } } }
    SAVE.volatile = !!r.volatile || !Store.db;
    if (!SAVE.blocked) { const upgrade = !!(r.db && (r.db.schema || 2) < SCHEMA); migrate(); if (r.status === "recovered" || upgrade || Store.legacy || r.fromLocal) { SAVE.dirty = true; flush({ snap: true }); } }
  }

      if (reg.waiting && navigator.serviceWorker.controller) { SAVE.update = reg.waiting; showSave(); }

  }

  applyBrand(); VIEW = { name: "login" }; render(); showSave();
})();
window.addEventListener("beforeunload", e => { saveDraft(); if (SAVE.dirty || SAVE.state === "saving" || SAVE.state === "error") { e.preventDefault(); e.returnValue = ""; } });
